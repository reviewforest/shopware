# Builds and validates the release ZIPs. Runs on merge requests and tags; nothing is published automatically.
# CI/CD variables (masked, protected): SHOPWARE_APP_SECRET (production app secret for the help-centre ZIP),
# APP_NAME (technical name with the Shopware manufacturer prefix).
stages:
  - build
  - validate

build:
  stage: build
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq git zip > /dev/null
  script:
    - bin/build.sh store
    - if [ -n "$CI_COMMIT_TAG" ]; then bin/build.sh zip; fi
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 30 days

validate:
  stage: validate
  image:
    name: ghcr.io/shopware/shopware-cli:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
  needs: [build]
  script:
    - mkdir -p /tmp/ext && cd /tmp/ext && unzip -q "$CI_PROJECT_DIR"/dist/*-store.zip
    - shopware-cli extension validate --full --store-compliance /tmp/ext/*/
